name: Build and publish GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (lockfile required)
        run: pnpm install --frozen-lockfile

      - name: Build plugin package
        run: pnpm build:marketplace

      - name: Verify release artifact
        run: |
          test -s package-marketplace.zip
          pnpm verify:marketplace
          # SiYuan expects the Release asset to be named package.zip.
          cp package-marketplace.zip package.zip

      - name: Run core regression tests
        run: |
          # Existing tests read dist/preview assets; the marketplace build uses
          # a separate directory to avoid overwriting the complete local build.
          ln -s dist-marketplace dist
          pnpm test:database-view-core
          pnpm test:calendar
          pnpm test:visual
          pnpm test:map

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: package.zip
          artifactErrorsFailBuild: true
          allowUpdates: false
          generateReleaseNotes: true
